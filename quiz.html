<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizBase — Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e11; --surface: #18181d; --surface2: #222229; --border: #2e2e38;
    --accent: #7c6ef7; --accent2: #a78bfa; --text: #f0f0f5; --muted: #8888a0;
    --success: #34d399; --danger: #f87171; --warning: #fbbf24; --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:1.2rem 2rem; border-bottom:1px solid var(--border); }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:-0.02em; }
  .logo span { color:var(--accent2); }
  .nav-links { display:flex; gap:8px; }
  .nav-links a { text-decoration:none; color:var(--muted); font-size:0.875rem; padding:6px 14px; border-radius:8px; transition:all 0.2s; }
  .nav-links a:hover, .nav-links a.active { background:var(--surface2); color:var(--text); }
  .nav-links a.active { color:var(--accent2); }
  .container { max-width:680px; margin:0 auto; padding:2.5rem 1.5rem; }
  h1 { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:700; margin-bottom:0.4rem; }
  .subtitle { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }

  /* TELA SELEÇÃO */
  #tela-selecao {}
  .materias-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:1.5rem; }
  .materia-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.2rem; cursor:pointer; transition:all 0.2s; }
  .materia-card:hover { border-color:var(--accent); }
  .materia-card.selected { border-color:var(--accent2); background:rgba(124,110,247,0.1); }
  .mat-nome { font-family:'Syne',sans-serif; font-size:0.95rem; font-weight:600; margin-bottom:4px; }
  .mat-count { font-size:0.8rem; color:var(--muted); }
  .opcoes-row { display:flex; gap:10px; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; }
  .opcoes-row label { font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  select { background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.9rem; padding:8px 12px; outline:none; }
  .btn-start { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:12px 32px; font-family:'Syne',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn-start:hover { background:var(--accent2); transform:translateY(-1px); }
  .btn-start:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

  /* TELA QUIZ */
  #tela-quiz { display:none; }
  .progress-bar { height:4px; background:var(--surface2); border-radius:2px; margin-bottom:1.5rem; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px; transition:width 0.4s ease; }
  .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
  .q-numero { font-size:0.8rem; color:var(--muted); }
  .q-materia-badge { font-size:0.75rem; padding:3px 12px; border-radius:20px; background:rgba(124,110,247,0.15); color:var(--accent2); border:1px solid rgba(124,110,247,0.3); }
  .q-enunciado { font-size:1.05rem; line-height:1.6; margin-bottom:1.8rem; font-weight:400; }
  .q-banca { font-size:0.78rem; color:var(--muted); margin-bottom:1.2rem; margin-top:-1rem; }

  .alternativas-list { display:flex; flex-direction:column; gap:10px; }
  .alt-btn { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 18px; cursor:pointer; text-align:left; font-family:'DM Sans',sans-serif; font-size:0.95rem; color:var(--text); transition:all 0.2s; display:flex; align-items:center; gap:14px; }
  .alt-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(124,110,247,0.05); }
  .alt-letra { width:30px; height:30px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; flex-shrink:0; transition:all 0.2s; color:var(--muted); }
  .alt-btn.correta { border-color:var(--success)!important; background:rgba(52,211,153,0.1)!important; }
  .alt-btn.correta .alt-letra { background:var(--success); color:#000; border-color:var(--success); }
  .alt-btn.errada { border-color:var(--danger)!important; background:rgba(248,113,113,0.1)!important; }
  .alt-btn.errada .alt-letra { background:var(--danger); color:#000; border-color:var(--danger); }
  .alt-btn.neutra { opacity:0.5; }
  .alt-btn:disabled { cursor:default; }

  /* FEEDBACK */
  .feedback { margin-top:1.2rem; padding:14px 18px; border-radius:10px; font-size:0.9rem; display:none; }
  .feedback.acerto { background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.3); color:var(--success); }
  .feedback.erro { background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); color:var(--danger); }
  .feedback-icon { font-size:1.2rem; margin-right:8px; }

  .btn-next { margin-top:1.5rem; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:12px 28px; font-family:'Syne',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s; display:none; }
  .btn-next:hover { background:var(--accent2); }

  /* TELA RESULTADO */
  #tela-resultado { display:none; text-align:center; }
  .score-circle { width:140px; height:140px; border-radius:50%; border:4px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 1.5rem; }
  .score-num { font-family:'Syne',sans-serif; font-size:2.2rem; font-weight:800; color:var(--accent2); }
  .score-label { font-size:0.8rem; color:var(--muted); }
  .resultado-msg { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:700; margin-bottom:0.5rem; }
  .resultado-sub { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }
  .btn-reiniciar { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:11px 28px; font-family:'Syne',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s; margin:0 6px; }
  .btn-reiniciar:hover { background:var(--accent2); }
  .btn-outline { background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:11px 28px; font-family:'DM Sans',sans-serif; font-size:0.95rem; cursor:pointer; transition:all 0.2s; margin:0 6px; }
  .btn-outline:hover { border-color:var(--accent); color:var(--accent2); }

  .loader { text-align:center; padding:3rem; color:var(--muted); }
  .empty { text-align:center; padding:3rem; color:var(--muted); }

  @media(max-width:600px) {
    nav { padding:1rem; }
    .nav-links a span { display:none; }
    .q-enunciado { font-size:1.05rem; }
  }
</style>
</head>
<body>
<nav>
  <div class="logo">Quiz<span>Base</span></div>
  <div class="nav-links">
    <a href="cadastro.html">✏️ <span>Cadastro</span></a>
    <a href="quiz.html" class="active">🎯 <span>Quiz</span></a>
    <a href="historico.html">📊 <span>Histórico</span></a>
  </div>
</nav>

<div class="container">
  <!-- SELEÇÃO -->
  <div id="tela-selecao">
    <h1>Iniciar Quiz</h1>
    <p class="subtitle">Escolha a matéria e comece a responder</p>
    <div id="materias-container"><div class="loader">Carregando matérias...</div></div>
    <div class="opcoes-row">
      <label>Qtd. de questões:</label>
      <select id="qtd-questoes">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="0">Todas</option>
      </select>
      <label style="margin-left:10px">Ordem:</label>
      <select id="ordem">
        <option value="aleatorio">Aleatória</option>
        <option value="cadastro">Cadastro</option>
      </select>
    </div>
    <button class="btn-start" id="btn-iniciar" onclick="iniciarQuiz()" disabled>Iniciar →</button>
  </div>

  <!-- QUIZ -->
  <div id="tela-quiz">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="q-header">
      <span class="q-numero" id="q-numero"></span>
      <span class="q-materia-badge" id="q-materia-badge"></span>
    </div>
    <div class="q-enunciado" id="q-enunciado"></div>
    <div class="q-banca" id="q-banca"></div>
    <div class="alternativas-list" id="alternativas-list"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="btn-next" onclick="proximaQuestao()">Próxima →</button>
  </div>

  <!-- RESULTADO -->
  <div id="tela-resultado">
    <div class="score-circle">
      <div class="score-num" id="score-pct"></div>
      <div class="score-label">acertos</div>
    </div>
    <div class="resultado-msg" id="resultado-msg"></div>
    <div class="resultado-sub" id="resultado-sub"></div>
    <div>
      <button class="btn-reiniciar" onclick="voltarSelecao()">Nova sessão</button>
      <a href="historico.html"><button class="btn-outline">Ver histórico</button></a>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

let db, todasQuestoes=[], fila=[], idx=0, acertos=0, materiaSelecionada=null, sessaoResultados=[];
const letras=['A','B','C','D','E'];

function getConfig(){ const c=localStorage.getItem('qb_config'); return c?JSON.parse(c):null; }

async function init() {
  const cfg=getConfig();
  if(!cfg){ document.getElementById('materias-container').innerHTML='<div class="empty">Configure o Firebase na página de <a href="cadastro.html" style="color:var(--accent2)">Cadastro</a> primeiro.</div>'; return; }
  try {
    const app=initializeApp(cfg);
    db=getFirestore(app);
    await carregarQuestoes();
  } catch(e){ document.getElementById('materias-container').innerHTML='<div class="empty">Erro ao conectar Firebase.</div>'; }
}

async function carregarQuestoes() {
  const q=query(collection(db,'questoes'),orderBy('criadoEm','asc'));
  const snap=await getDocs(q);
  todasQuestoes=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderMaterias();
}

function renderMaterias() {
  const materias=[...new Set(todasQuestoes.map(q=>q.materia))].sort();
  const c=document.getElementById('materias-container');
  if(!materias.length){ c.innerHTML='<div class="empty">Nenhuma questão cadastrada ainda.</div>'; return; }

  c.innerHTML=`
    <div class="materias-grid">
      <div class="materia-card" id="mat-todas" onclick="selecionarMateria(null)">
        <div class="mat-nome">📚 Todas</div>
        <div class="mat-count">${todasQuestoes.length} questões</div>
      </div>
      ${materias.map(m=>`
        <div class="materia-card" id="mat-${btoa(m)}" onclick="selecionarMateria('${m.replace(/'/g,"\\'")}')">
          <div class="mat-nome">${m}</div>
          <div class="mat-count">${todasQuestoes.filter(q=>q.materia===m).length} questões</div>
        </div>
      `).join('')}
    </div>`;
}

window.selecionarMateria = function(m) {
  materiaSelecionada=m;
  document.querySelectorAll('.materia-card').forEach(c=>c.classList.remove('selected'));
  const id=m?'mat-'+btoa(m):'mat-todas';
  const el=document.getElementById(id);
  if(el) el.classList.add('selected');
  document.getElementById('btn-iniciar').disabled=false;
}

window.iniciarQuiz = function() {
  let pool = materiaSelecionada ? todasQuestoes.filter(q=>q.materia===materiaSelecionada) : [...todasQuestoes];
  if(!pool.length) return;
  const ordem=document.getElementById('ordem').value;
  if(ordem==='aleatorio') pool=pool.sort(()=>Math.random()-0.5);
  const qtd=parseInt(document.getElementById('qtd-questoes').value)||pool.length;
  fila=qtd>0?pool.slice(0,qtd):pool;
  idx=0; acertos=0; sessaoResultados=[];
  document.getElementById('tela-selecao').style.display='none';
  document.getElementById('tela-quiz').style.display='block';
  renderQuestao();
}

function renderQuestao() {
  const q=fila[idx];
  const pct=((idx)/fila.length*100).toFixed(0);
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('q-numero').textContent=`${idx+1} / ${fila.length}`;
  document.getElementById('q-materia-badge').textContent=q.materia;
  document.getElementById('q-enunciado').textContent=q.enunciado;
  document.getElementById('q-banca').textContent=q.banca?`Fonte: ${q.banca}`:'';
  document.getElementById('feedback').style.display='none';
  document.getElementById('btn-next').style.display='none';

  const c=document.getElementById('alternativas-list');
  c.innerHTML='';
  const alts=q.tipo==='certo_errado'?['Certo','Errado']:q.alternativas;
  alts.forEach((a,i)=>{
    const btn=document.createElement('button');
    btn.className='alt-btn';
    btn.innerHTML=`<span class="alt-letra">${q.tipo==='certo_errado'?(i===0?'C':'E'):letras[i]}</span><span>${a}</span>`;
    btn.onclick=()=>responder(i,q.gabarito,q);
    c.appendChild(btn);
  });
}

function responder(escolha, gabarito, q) {
  document.querySelectorAll('.alt-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===gabarito) b.classList.add('correta');
    else if(i===escolha&&escolha!==gabarito) b.classList.add('errada');
    else b.classList.add('neutra');
  });
  const acertou=escolha===gabarito;
  if(acertou) acertos++;
  const fb=document.getElementById('feedback');
  fb.className='feedback '+(acertou?'acerto':'erro');
  fb.innerHTML=acertou?'<span class="feedback-icon">✓</span> Resposta correta!':'<span class="feedback-icon">✗</span> Resposta incorreta.';
  fb.style.display='block';
  sessaoResultados.push({materia:q.materia, acertou});
  document.getElementById('btn-next').style.display='block';
  document.getElementById('btn-next').textContent=idx===fila.length-1?'Ver resultado →':'Próxima →';
}

window.proximaQuestao = function() {
  idx++;
  if(idx>=fila.length) { finalizarSessao(); return; }
  renderQuestao();
}

async function finalizarSessao() {
  const pct=Math.round(acertos/fila.length*100);
  document.getElementById('tela-quiz').style.display='none';
  document.getElementById('tela-resultado').style.display='block';
  document.getElementById('score-pct').textContent=pct+'%';
  const msgs=[[0,49,'Não desanime! Continue estudando.'],[50,69,'Bom começo! Revise os erros.'],[70,84,'Muito bom! Está progredindo.'],[85,100,'Excelente! Domínio sólido.']];
  const [,, msg]=msgs.find(([min,max])=>pct>=min&&pct<=max)||[0,100,''];
  document.getElementById('resultado-msg').textContent=msg;
  document.getElementById('resultado-sub').textContent=`${acertos} de ${fila.length} questões corretas`;
  // salvar histórico
  try {
    const por_materia={};
    sessaoResultados.forEach(r=>{ if(!por_materia[r.materia]) por_materia[r.materia]={acertos:0,erros:0}; por_materia[r.materia][r.acertou?'acertos':'erros']++; });
    await addDoc(collection(db,'historico'),{ data:Date.now(), total:fila.length, acertos, materia:materiaSelecionada||'Todas', por_materia });
  } catch(e){}
}

window.voltarSelecao = function() {
  document.getElementById('tela-resultado').style.display='none';
  document.getElementById('tela-selecao').style.display='block';
  document.querySelectorAll('.materia-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('btn-iniciar').disabled=true;
  materiaSelecionada=null;
}

init();
</script>
</body>
</html>
